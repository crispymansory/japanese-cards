<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語"><meta name="theme-color" content="#14161c">
<title>Заучивалка</title><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css"></head><body>
<header><button id="homeBtn" class="ghost">🏠</button><h1>Заучивалка</h1><button id="statsBtn" class="ghost">📊</button></header>
<main>
<section id="home">
 <h2>Уроки</h2><div id="lessons" class="chips"></div>
 <h2>Направление</h2><div id="dir" class="chips">
  <button data-v="jr">Японский → Русский</button><button data-v="rj">Русский → Японский</button><button data-v="mix">Вперемешку</button></div>
 <h2>Новых слов за сессию: <span id="nNewVal"></span></h2><input id="nNew" type="range" min="0" max="50" step="5">
 <label class="row"><input type="checkbox" id="typeMode"> Режим ввода (Рус → Яп: пиши каной или ромадзи)</label>
 <label class="row"><input type="checkbox" id="autoSpeak"> Автоматически озвучивать японское</label>
 <p id="summary"></p>
 <button id="startBtn" class="big">Начать</button>
 <button id="practiceBtn" class="big alt">Повторить всё выбранное (без влияния на интервалы)</button>
</section>
<section id="study" hidden>
 <div id="progress"></div>
 <div id="card"><div id="front"></div><div id="back" hidden></div></div>
 <div id="typeBox" hidden><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="かな или romaji"><button id="checkBtn">Проверить</button></div>
 <div id="verdict"></div>
 <button id="speakBtn" class="ghost big">🔊 Произнести</button>
 <div id="grade" hidden><button data-g="0" class="bad">Не помню</button><button data-g="1" class="mid">С трудом</button><button data-g="2" class="good">Помню</button></div>
 <p class="hint" id="hint">Нажми на карточку, чтобы перевернуть</p>
</section>
<section id="done" hidden><h2>Готово! 🎉</h2><p id="doneText"></p><button class="big" id="againBtn">На главную</button></section>
<section id="stats" hidden><h2>Статистика</h2><table id="statTable"></table><p class="hint">Выучено = слово в коробке 4+ (интервал ≥ 7 дней).</p><button id="resetBtn" class="ghost">Сбросить прогресс</button></section>
</main>
<script src="srs.js"></script><script src="app.js"></script></body></html>
